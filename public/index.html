<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>珈琲テイスティングノート</title>
<meta name="description" content="お店の一杯と、家の一杯を記録する珈琲のテイスティングノート">
<meta name="theme-color" content="#FBFAF8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="珈琲ノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="/style.css">
</head>
<body data-mode="view">
<main id="view"></main>

<nav class="tabbar" aria-label="画面の切り替え">
  <a href="#/" aria-current="page">ノート</a>
  <button type="button" id="newBtn" class="fab" aria-label="新しく記録する"><span></span></button>
  <a href="#/map">マップ</a>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-body" role="dialog" aria-label="何を記録しますか">
    <p class="sheet-title">どこで飲みましたか</p>
    <a href="#/new/cafe" class="choice cafe"><span class="choice-ico"></span><strong>お店で</strong></a>
    <a href="#/new/home" class="choice home"><span class="choice-ico"></span><strong>家で</strong></a>
  </div>
</div>

<div id="full" class="full" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="/js/app.js"></script>
